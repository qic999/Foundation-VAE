model:
  base_learning_rate: 5.0e-7
  target: ldm.models.diffusion.ddpm.LatentDiffusion
  params:
    linear_start: 0.00085
    linear_end: 0.0120
    num_timesteps_cond: 1
    log_every_t: 200
    timesteps: 1000
    first_stage_key: slice_data
    cond_stage_key: masked_slice
    cond_stage_trainable: false
    conditioning_key: concat # crossattn
    image_size: 64
    channels: 9
    monitor: val/loss_simple_ema
    scale_factor: 0.18215
    use_ema: True

    unet_config:
      target: ldm.modules.diffusionmodules.openaimodel.UNetModel
      params:
        image_size: 64
        in_channels: 9 # 4
        out_channels: 4 # 4
        model_channels: 224
        attention_resolutions: [ 8, 4, 2 ]
        num_res_blocks: 2
        channel_mult: [ 1, 2, 3, 4 ]
        num_head_channels: 32
        use_spatial_transformer: false
        transformer_depth: 1
        use_checkpoint: True
        legacy: False

    first_stage_config:
      target: ldm.models.autoencoder.AutoencoderKL
      params:
        ckpt_path: '/storage/chenqi/code/latent-diffusion-main/models/first_stage_models/kl-f8/model.ckpt'
        embed_dim: 4
        monitor: val/rec_loss
        ddconfig:
          double_z: true
          z_channels: 4
          resolution: 256
          in_channels: 3
          out_ch: 3
          ch: 128
          ch_mult:
          - 1
          - 2
          - 4
          - 4
          num_res_blocks: 2
          attn_resolutions: []
          dropout: 0.0
        lossconfig:
          target: torch.nn.Identity
    cond_stage_config: __is_first_stage__

data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 48 # 32
    num_workers: 16
    wrap: false
    train:
      target: ldm.data.slice_dataset.slice_train
      params:
        data_root: '/storage/chenqi/data/our_data/nnUNet_preprocessed/'
        data_name: 'Dataset017_AbdomenAtlas2.0_base_pancreas'
        planner: 'nnUNetPlans_3d_fullres'
        data_file: 'data_split/pancreas/splits_final.json'
        data_repeat: 50 # 1000 100
    validation:
      target: ldm.data.slice_dataset.slice_val
      params:
        data_root: '/storage/chenqi/data/our_data/nnUNet_preprocessed/'
        data_name: 'Dataset017_AbdomenAtlas2.0_base_pancreas'
        planner: 'nnUNetPlans_3d_fullres'
        data_file: 'data_split/pancreas/splits_final.json'
        data_repeat: 20 # 1000 100

lightning:
  callbacks:
    image_logger:
      target: main.ImageLogger
      params:
        batch_frequency: 500
        max_images: 32
        increase_log_steps: False

  trainer:
    benchmark: True
